<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Lokalnie — rezerwuj usługi lokalnie. Klient i usługodawca w jednej aplikacji." />
  <meta name="theme-color" content="#5b8def" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lokalnie" />
  <meta name="application-name" content="Lokalnie" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <title>Lokalnie — rezerwuj usługi lokalnie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=686" />
</head>
<body>

  <!-- Marketplace — widoczny od razu, także bez logowania -->
  <div id="page-app" data-active-role="client">
    <header class="app-header">
      <div class="app-header__inner">
        <button type="button" class="logo logo--btn" data-action="go-home" aria-label="Lokalnie — marketplace">
          <span class="logo-mark" aria-hidden="true"><img class="logo-mark__img" src="assets/icons/logo-1024.png" alt="" width="40" height="40" /></span>
          <span class="logo-text">Lokalnie</span>
        </button>

        <nav class="app-header__nav" id="app-header-nav" aria-label="Menu aplikacji"></nav>

        <div class="app-header__right">
          <span class="app-header__user" id="app-header-user"></span>
          <button type="button" class="app-header__menu-btn" id="app-header-menu-btn" data-action="toggle-app-menu"
            aria-label="Menu" aria-expanded="false" aria-controls="app-menu-panel">
            <span class="app-header__menu-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="app-fullscreen" id="app-fullscreen"></div>
  </div><!-- /#page-app -->

  <div class="toast" id="app-toast" role="status" aria-live="polite" hidden></div>

  <script src="data.js?v=27"></script>
  <script src="api.js?v=5"></script>
  <script src="app.js?v=700"></script>
</body>
</html>
